global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The incident's API process (prom-client).
  - job_name: api
    static_configs:
      - targets: ["api:9464"]

  # The edge proxy: latency as experienced by clients.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
