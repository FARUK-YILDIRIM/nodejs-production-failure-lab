# Service-level alerts, evaluated on edge (Traefik) metrics: what customers experience.
groups:
  - name: shopflow-slo
    rules:
      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service="api@file"}[2m]))
          ) > 0.5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "API p95 latency at the edge is above 500 ms"
          description: "p95 = {{ $value | humanizeDuration }} over the last 2 minutes."

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(traefik_service_requests_total{service="api@file", code=~"5.."}[2m]))
            / sum(rate(traefik_service_requests_total{service="api@file"}[2m])) > 0.01
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "More than 1% of API requests are failing"
          description: "Error ratio = {{ $value | humanizePercentage }} over the last 2 minutes."

      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the API"
