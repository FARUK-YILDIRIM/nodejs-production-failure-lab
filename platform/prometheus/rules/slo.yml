# Service-level alerts, evaluated on edge (Traefik) metrics: what customers experience.
groups:
  - name: shopflow-slo
    rules:
      # Reads only: placing an order includes a card authorization (a few hundred
      # milliseconds at the card network) and has its own alert, CheckoutSlow.
      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket{entrypoint="web", method="GET"}[2m]))
          ) > 0.5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "API p95 latency at the edge is above 500 ms (GET requests)"
          description: "p95 = {{ $value | humanizeDuration }} over the last 2 minutes."

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(traefik_entrypoint_requests_total{entrypoint="web", code=~"5.."}[2m]))
            / sum(rate(traefik_entrypoint_requests_total{entrypoint="web"}[2m])) > 0.01
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "More than 1% of API requests are failing"
          description: "Error ratio = {{ $value | humanizePercentage }} over the last 2 minutes."

      # Requests clients gave up on before getting an answer (HTTP 499 at the edge).
      # A hanging API produces no errors at all, only clients that stop waiting.
      - alert: ClientsGivingUp
        expr: |
          sum(rate(traefik_entrypoint_requests_total{entrypoint="web", code="499"}[2m]))
            / sum(rate(traefik_entrypoint_requests_total{entrypoint="web"}[2m])) > 0.01
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Clients give up on more than 1% of API requests before getting an answer (HTTP 499)"
          description: "Abandoned ratio = {{ $value | humanizePercentage }} over the last 2 minutes."

      # PayFlow's risk engine flags a hold on a card for the same amount as another
      # one still active on it: what customers see as being charged twice.
      - alert: DuplicateCharges
        expr: sum(increase(payflow_duplicate_authorizations_total[10m])) > 0
        labels:
          severity: page
        annotations:
          summary: "PayFlow flagged possible duplicate charges in the last 10 minutes"
          description: "{{ $value | humanize }} card authorizations look like duplicates of another active one."

      # Orders keep coming in, but no confirmation email has gone out (incidents with a worker).
      - alert: ConfirmationsStuck
        expr: |
          sum(increase(order_confirmations_sent_total[10m])) == 0
            and sum(increase(http_server_request_duration_seconds_count{job="api", route="/api/orders", method="POST", status_code="201"}[10m])) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "No order confirmation sent for 10 minutes, while orders keep coming in"

      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the API"

      - alert: ApiRestarting
        expr: changes(process_start_time_seconds{job="api"}[15m]) >= 2
        labels:
          severity: page
        annotations:
          summary: "The API process restarted {{ $value }} times in the last 15 minutes"

      - alert: CheckoutSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{job="api", route="/api/orders", method="POST"}[2m]))
          ) > 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "p95 of POST /api/orders is above 1 s"

      - alert: DatabaseBusy
        expr: sum(rate(pg_stat_statements_seconds_total{datname="shop"}[2m])) > 2
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "PostgreSQL has spent more than 2 s per second executing queries for 2 minutes"

      - alert: OrderHistorySlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{job="api", route="/api/customers/:id/orders"}[2m]))
          ) > 0.3
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "p95 of GET /api/customers/:id/orders is above 300 ms"
