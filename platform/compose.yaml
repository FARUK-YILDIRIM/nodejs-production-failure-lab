# Shared platform: edge proxy + observability stack.
# Every incident's compose.yaml includes this file, so `./lab start <id>` brings up
# the same tooling around a different broken service.
#
# Host ports are bound to 127.0.0.1 only and can be overridden with LAB_PORT_* variables.

services:
  traefik:
    image: traefik:v3.7.16
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addServicesLabels=true
      - --metrics.prometheus.buckets=0.005,0.01,0.025,0.05,0.1,0.25,0.5,0.75,1,2.5,5,10
      - --tracing=true
      - --tracing.serviceName=traefik
      - --tracing.sampleRate=0.2
      - --tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces
      - --ping=true
      - --log.level=WARN
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    ports:
      - "127.0.0.1:${LAB_PORT_API:-8080}:80"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${LAB_PORT_PROMETHEUS:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${LAB_PORT_GRAFANA:-3000}:3000"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    command: ["--config=file:/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:${LAB_PORT_JAEGER:-16686}:16686"
    restart: unless-stopped

  # Database metrics for every incident's PostgreSQL: sessions, table scans, pg_stat_statements.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=160
    environment:
      DATA_SOURCE_NAME: postgresql://shop:shop@postgres:5432/shop?sslmode=disable
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:2.1.2
    ports:
      - "127.0.0.1:${LAB_PORT_PYROSCOPE:-4040}:4040"
    restart: unless-stopped

volumes:
  prometheus-data:
