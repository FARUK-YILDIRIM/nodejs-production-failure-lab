apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  # Traces live in the Jaeger UI (http://localhost:16686). Jaeger v2 only serves
  # its v3 query API, which Grafana's Jaeger data source doesn't speak yet.

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040

  # Incidents that ship a PostgreSQL database use these credentials.
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: shop
    jsonData:
      database: shop
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: shop
