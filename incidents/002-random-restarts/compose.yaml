# Incident 002: the ShopFlow API, its database and simulated production traffic.
# Edge proxy and observability come from the shared platform.
name: nplab

include:
  - ../../platform/compose.yaml

services:
  api:
    build: ./app
    image: nplab/002-random-restarts-api
    environment:
      PORT: "3000"
      METRICS_PORT: "9464"
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      OTEL_SERVICE_NAME: shopflow-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.2"
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
    volumes:
      # Your working copy of the code. `./lab deploy` restarts the service with it.
      - ${LAB_APP_SRC:-./app/src}:/app/src:ro
    ports:
      - "127.0.0.1:${LAB_PORT_INSPECTOR:-9229}:9229"
    cpus: 1
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata-002:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Only passes once the init scripts (schema + seed) have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 150
    restart: unless-stopped

  # Simulated production traffic, running until the lab is stopped.
  traffic:
    image: grafana/k6:2.1.0
    command: ["run", "--quiet", "--no-usage-report", "--summary-mode=disabled", "/load/load.ts"]
    environment:
      MODE: traffic
      BASE_URL: http://traefik
    volumes:
      - ./load:/load:ro
    depends_on:
      api:
        condition: service_healthy
      traefik:
        condition: service_healthy
    restart: unless-stopped

  # On-demand load runs (`./lab verify`); not started by `up`.
  k6:
    image: grafana/k6:2.1.0
    profiles: ["tools"]
    environment:
      BASE_URL: http://traefik
    volumes:
      - ./load:/load:ro

volumes:
  pgdata-002:
